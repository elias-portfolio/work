<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191a">
  <title>False Start · The longest run wins</title>
  <link rel="stylesheet" href="css/false-start.css?v=classic1">
  <script src="js/vendor/planck.min.js?v=1.5.1" defer></script>
  <script src="js/false-start-physics.js?v=classic1" defer></script>
  <script src="js/false-start.js?v=classic1" defer></script>
</head>
<body>
  <main class="meet" aria-labelledby="game-title">
    <header class="mast">
      <h1 id="game-title">False Start</h1>
      <button type="button" id="reset" aria-keyshortcuts="Space" aria-label="Restart both attempts">Restart</button>
      <p>One attempt each. A fall ends your run. Longest distance wins.</p>
    </header>

    <section class="arena" aria-label="The two attempts">
      <canvas id="track" width="640" height="396" tabindex="0" aria-label="Split-screen view of the two running tracks">Your browser does not support canvas.</canvas>
      <div class="lane-ui lane-one" role="group" aria-label="Player 1">
        <div class="keys"><span>Thighs</span><button type="button" data-key="KeyQ" aria-label="Player 1, thigh Q">Q</button><button type="button" data-key="KeyW" aria-label="Player 1, thigh W">W</button></div>
        <div class="score"><span class="player-name">Player 1</span><output id="distance-0" aria-live="off">0.0 m</output><span id="lane-status-0">Ready</span></div>
        <div class="keys"><span>Calves</span><button type="button" data-key="KeyE" aria-label="Player 1, calf E">E</button><button type="button" data-key="KeyR" aria-label="Player 1, calf R">R</button></div>
      </div>
      <div class="lane-ui lane-two" role="group" aria-label="Player 2">
        <div class="keys"><span>Thighs</span><button type="button" data-key="KeyU" aria-label="Player 2, thigh U">U</button><button type="button" data-key="KeyI" aria-label="Player 2, thigh I">I</button></div>
        <div class="score"><span class="player-name">Player 2</span><output id="distance-1" aria-live="off">0.0 m</output><span id="lane-status-1">Ready</span></div>
        <div class="keys"><span>Calves</span><button type="button" data-key="KeyO" aria-label="Player 2, calf O">O</button><button type="button" data-key="KeyP" aria-label="Player 2, calf P">P</button></div>
      </div>
      <div class="race-banner" id="banner" hidden><strong id="banner-title"></strong><small id="banner-detail"></small></div>
      <p class="sr-only" role="status" id="race-status"></p>
    </section>

    <footer class="notes">
      <p id="start-hint">Press any of your four keys to start. Space restarts both.</p>
      <a href="https://www.foddy.net/legacy/Athletics.html" target="_blank" rel="noopener">Original QWOP by Bennett Foddy ↗</a>
    </footer>
  </main>
</body>
</html>
