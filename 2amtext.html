<script>
  (function redirectMobileVisitorsToRadioMode() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('desktop')) return;

    const hasCoarseMobileViewport = window.matchMedia &&
      window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
    const hasMobileUserAgent = /Android|iPhone|iPod|Windows Phone|IEMobile|Mobile/i
      .test(navigator.userAgent || '');

    if (!hasCoarseMobileViewport && !hasMobileUserAgent) return;

    const target = new URL('./radiomp3.html', window.location.href);
    target.hash = window.location.hash;
    window.location.replace(target.href);
  })();
</script>

      return typeof bg === 'string' ? bg : JSON.stringify(bg || {});

      "fO9e9jnhYK8",
      "6JTS9S16axQ",

    function shouldCropEarthRelaySource(bg) {
      const source = backgroundKey(bg).toLowerCase();
      return earthRelayCropIds.some(id => source.includes(id.toLowerCase())) || /nasa|iss|earth from space|earth livestream/.test(source);
    }

    function applyEarthRelayCrop(bg) {
      document.querySelector(".video-bg")?.classList.toggle("earth-relay-crop", shouldCropEarthRelaySource(bg));

    function armBackgroundFallback(offset, attempt, label) {
      clearTimeout(window._bgFallbackTimer);
      const candidates = backgroundCandidates(offset);
      if (attempt >= candidates.length - 1) return;
      window._bgFallbackTimer = setTimeout(() => {
        if (virtualOffset === offset && currentBackgroundAttempt === attempt) {
          console.warn(`background ${label || 'stream'} slow; trying fallback`, { offset, attempt: attempt + 1 });
          updateBackground(offset, attempt + 1);
        }
      }, 18000);
    }

    function disarmBackgroundFallback() {
      clearTimeout(window._bgFallbackTimer);
    }

    function getAutoOffset() {
      let offset = (2 - new Date().getUTCHours() + 24) % 24;
      return offset > 12 ? offset - 24 : offset;
    }

      const newStream = radioStreams[offset];

        audio.play().catch(console.error);
      }

      updateBackground(offset);
      updateHighlights(offset);
    }

                  events: {
                    'onReady': function(event) {
                      event.target.mute();
                      event.target.setPlaybackQuality('hd1080');
                    },
                    'onStateChange': function(event) {
                      event.target.mute();
                    }
                  }
                });
              }
            } catch (e) {
              console.log("YouTube API init:", e);
            }
          };
        }
      }
    }

    function enforceMuting() {
      const bgFrame = document.getElementById("bg-frame");
      if (bgFrame && bgFrame.contentWindow) {
        try {
          bgFrame.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
          bgFrame.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[0]}', '*');
        } catch (e) {
          // Cross-origin restriction may apply, but postMessage usually succeeds
        }
      }
      
      if (ytPlayer && typeof ytPlayer.mute === 'function') {
        try {
          ytPlayer.mute();
        } catch (e) {}
      }
    }

    setInterval(enforceMuting, 1000);

    function updateClock() {
      const now = new Date();

      if (!manualOffset) {
        const autoOffset = getAutoOffset();
        if (virtualOffset !== autoOffset) {
          virtualOffset = autoOffset;
          syncStationToOffset(virtualOffset);
        }
      }

      const utcHours = now.getUTCHours();
      const timezoneHours = (utcHours + virtualOffset + 24) % 24;
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      
      const hours = timezoneHours.toString().padStart(2, '0');
      document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    function updateHighlights(offset) {
      document.querySelectorAll('.gmt, .stream, .location').forEach(el => {
        el.classList.remove('gmt', 'stream', 'location');
      });

      document.querySelectorAll('#radio-zones .zone').forEach(zone => {
        if (zone.dataset.blockType === 'gmt') {
          if (zone.dataset.key === String(offset)) {
            zone.classList.add('gmt');
          }
        } else if (zone.dataset.blockType === 'stream' && zone.dataset.key === String(offset)) {
          zone.classList.add('stream');
        } else if (zone.dataset.blockType === 'location') {
          const isActive = zone.dataset.key === String(offset);
          const note = isActive ? zonePopulationNotes[zone.dataset.key] : null;
          zone.innerHTML = note ? `${zone.dataset.name} <span class="zone-note">(${note})</span>` : zone.dataset.name;
          if (isActive) zone.classList.add('location');
        }
      });
    }

    updateHighlights(virtualOffset);

    document.body.addEventListener("click", (e) => {
      const clickedText = e.target.closest(".zone");
      const clickedRewind = e.target.id === "rewind" || e.target.closest("#rewind");
      const clickedClock = e.target.id === "clock" || e.target.closest("#clock");
      const clickedHideUI = e.target.id === "hideUI" || e.target.closest("#hideUI");
      const clickedClockMode = e.target.id === "clockMode" || e.target.closest("#clockMode");
      const clickedFullscreen = e.target.id === "fullscreen" || e.target.closest("#fullscreen");

      if (!clickedText && !clickedRewind && !clickedClock && !clickedHideUI && !clickedClockMode && !clickedFullscreen) {
        if (audio.paused) {
          audio.play().catch(console.error);
        } else {
          audio.pause();
        }
      }
    });

    document.getElementById("rewind").addEventListener("click", () => {
      virtualOffset = virtualOffset - 1;
      if (virtualOffset < -12) virtualOffset = 12;
      manualOffset = true;

      const newStream = radioStreams[virtualOffset];
      if (newStream) {
        audio.src = newStream;
        audio.play().catch(console.error);
      }
      
      updateBackground(virtualOffset);
      updateHighlights(virtualOffset);
    });

    document.getElementById("playPause").addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          document.getElementById("playPause").textContent = "pause";
        }).catch(console.error);
      } else {
        audio.pause();
        document.getElementById("playPause").textContent = "play";
      }
    });

    audio.addEventListener("play", () => {
      document.getElementById("playPause").textContent = "pause";
    });

    audio.addEventListener("pause", () => {
      document.getElementById("playPause").textContent = "play";
    });

    document.getElementById("hideUI").addEventListener("click", () => {
      const hideUIButton = document.getElementById("hideUI");
      const zones = document.querySelectorAll('.zone:not(#hideUI)');
      const isHidden = Array.from(zones).every(zone => zone.style.display === 'none');

      zones.forEach(zone => {
        zone.style.display = isHidden ? '' : 'none';
      });

      hideUIButton.textContent = isHidden ? 'hide text' : 'show text';
    });

    document.getElementById("clockMode").addEventListener("click", () => {
      window.location.href = './radiomp3.html';
    });

    document.getElementById("fullscreen").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen().catch(console.error);
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      updateBackground(virtualOffset);
      enforceMuting();
    });
</script>
</body>
</html>
