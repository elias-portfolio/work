<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Always 2AM Radio</title>
  <style>
    @font-face {
      font-family: 'WieynkFraktur';
      src: url('css/WieynkFraktur.woff2') format('woff2'),
           url('css/WieynkFraktur.woff') format('woff');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Suisse';
      src: url('css/suisse.woff') format('woff');
      font-weight: 400;
      font-style: normal;
    }

    html, body {
      font-family: 'WieynkFraktur', serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0b22;
      color: #fff;
      width: 100%;
      height: 100%;
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    #bg-stream-iframe, #bg-stream-video, #bg-stream-img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.77777778vh;
      height: 100vh;
      transform: translate(-50%, -50%) scale(1.5);
      transform-origin: center center;
      border: 0;
      pointer-events: none;
      object-fit: cover;
      display: none;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
    }

    .clock {
      font-size: 5rem;
      font-family: 'Suisse', sans-serif;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .info {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 15px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      backdrop-filter: blur(5px);
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="video-background">
    <iframe id="bg-stream-iframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0" playsinline></iframe>
    <img id="bg-stream-img" alt="live cam" />
  </div>

  <div class="container">
    <div class="clock" id="clock-display">02:00</div>
    <div class="info" id="stream-info">Loading...</div>
    <div class="controls">
      <button class="btn" id="play-btn">play</button>
      <a class="btn" href="2amtext.html">text mode</a>
    </div>
  </div>

  <audio id="radio-player"></audio>

      "12": "shors-refresh"
    };

    function get2amOffset() {
      const utcHour = new Date().getUTCHours();
      let offset = (2 - utcHour + 24) % 24;
      if (offset > 12) offset -= 24;
      return offset;
    }

    function updateView() {
      const offset = get2amOffset();
      const location = streamLocations[offset] || "Unknown Location";
      const audioUrl = radioStreams[offset];
      const bg = backgroundStreams[offset];

      document.getElementById('stream-info').textContent = `${location} (UTC${offset >= 0 ? '+' : ''}${offset})`;

      const audio = document.getElementById('radio-player');
      if (audio.src !== audioUrl) {
        audio.src = audioUrl;
      }

      const iframe = document.getElementById('bg-stream-iframe');
      const img = document.getElementById('bg-stream-img');

      clearInterval(window._imgInterval);

      if (bg === 'shors-refresh' || (bg && typeof bg === 'object' && bg.type === 'image-refresh')) {
        iframe.style.display = 'none';
        img.style.display = 'block';
        const imgUrl = bg === 'shors-refresh' ? 'https://www.shors.ru/images/camera/image96.jpg' : (bg.url || bg.image_url);
        const refresh = () => { img.src = `${imgUrl}?t=${Date.now()}`; };
        refresh();
        window._imgInterval = setInterval(refresh, (bg.intervalMs || 60000));
      } else if (typeof bg === 'string') {
        img.style.display = 'none';
        iframe.style.display = 'block';
        if (iframe.src !== bg) {
          iframe.src = bg;
        }
      }
    }

    document.getElementById('play-btn').addEventListener('click', () => {
      const audio = document.getElementById('radio-player');
      const btn = document.getElementById('play-btn');
      if (audio.paused) {
        audio.play().then(() => { btn.textContent = 'pause'; }).catch(console.error);
      } else {
        audio.pause();
        btn.textContent = 'play';
      }
    });

    setInterval(() => {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      document.getElementById('clock-display').textContent = `${hours}:${minutes}:${seconds}`;
    }, 1000);

    updateView();
  </script>

</html>
